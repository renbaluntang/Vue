<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#FDF9EF" />
    <title>Instructor Panel</title>
    <link rel="preload" as="image" href="/icon-black.svg" />
    <style>
      /* Boot splash. Inlined on purpose: this has to paint before the bundle
         and the stylesheet arrive, which is the whole window it covers. */
      #app-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 22px;
        background: #FDF9EF;
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
        transition: opacity .35s ease, visibility .35s ease;
      }
      #app-splash[hidden-fading] { opacity: 0; visibility: hidden; }

      /* The brand icon itself, rotating. Loaded from /public so the splash
         markup stays tiny; preloaded in <head> so it starts with the document. */
      .splash-icon {
        width: 66px;
        height: 66px;
        display: block;
        animation: splash-spin 1.35s cubic-bezier(.58, .12, .42, .88) infinite;
      }

      @keyframes splash-spin {
        to { transform: rotate(360deg); }
      }

      /* Visually hidden, still announced — the splash carries no visible text. */
      .splash-sr {
        position: absolute;
        width: 1px;
        height: 1px;
        margin: -1px;
        padding: 0;
        overflow: hidden;
        clip: rect(0 0 0 0);
        white-space: nowrap;
        border: 0;
      }

      @media (prefers-reduced-motion: reduce) {
        .splash-icon { animation: none; opacity: .75; }
        #app-splash { transition: none; }
      }

      @media (prefers-color-scheme: dark) {
        /* The app itself is light, so keep the splash light too — flashing dark
           and then white is worse than one consistent ground. */
        #app-splash { background: #FDF9EF; }
      }
    </style>
  </head>
  <body>
    <div id="app-splash" role="status" aria-live="polite">
      <img class="splash-icon" src="/icon-black.svg" alt="" aria-hidden="true" />
      <span class="splash-sr">Loading</span>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
