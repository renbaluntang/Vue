<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#FDF9EF" />
    <title>Instructor Panel</title>
    <style>
      /* Boot splash. Inlined on purpose: this has to paint before the bundle
         and the stylesheet arrive, which is the whole window it covers. */
      #app-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 22px;
        background: #FDF9EF;
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
        transition: opacity .35s ease, visibility .35s ease;
      }
      #app-splash[hidden-fading] { opacity: 0; visibility: hidden; }

      /* Flipping brand tile — gold face, ink reverse. Pure CSS so it paints
         before any asset request resolves. */
      .splash-icon {
        width: 58px;
        height: 58px;
        perspective: 620px;
      }
      .splash-icon__inner {
        position: relative;
        width: 100%;
        height: 100%;
        transform-style: preserve-3d;
        animation: splash-flip 1.9s cubic-bezier(.62, .02, .34, 1) infinite;
      }
      .splash-icon__face {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 18px;
        backface-visibility: hidden;
        -webkit-backface-visibility: hidden;
        box-shadow: 0 10px 24px -12px rgba(26, 26, 26, .55);
      }
      .splash-icon__face::after {
        content: "";
        width: 18px;
        height: 18px;
        border-radius: 999px;
        border: 3px solid currentColor;
        border-right-color: transparent;
        opacity: .9;
      }
      .splash-icon__front {
        background: linear-gradient(145deg, #FFCD00, #FFBD00);
        color: #1A1A1A;
      }
      .splash-icon__back {
        background: #1A1A1A;
        color: #FFCD00;
        transform: rotateY(180deg);
      }

      @keyframes splash-flip {
        0%   { transform: rotateY(0deg); }
        45%  { transform: rotateY(180deg); }
        55%  { transform: rotateY(180deg); }
        100% { transform: rotateY(360deg); }
      }

      /* Visually hidden, still announced — the splash carries no visible text. */
      .splash-sr {
        position: absolute;
        width: 1px;
        height: 1px;
        margin: -1px;
        padding: 0;
        overflow: hidden;
        clip: rect(0 0 0 0);
        white-space: nowrap;
        border: 0;
      }

      @media (prefers-reduced-motion: reduce) {
        .splash-icon__inner { animation: none; }
        #app-splash { transition: none; }
      }

      @media (prefers-color-scheme: dark) {
        /* The app itself is light, so keep the splash light too — flashing dark
           and then white is worse than one consistent ground. */
        #app-splash { background: #FDF9EF; }
      }
    </style>
  </head>
  <body>
    <div id="app-splash" role="status" aria-live="polite">
      <div class="splash-icon" aria-hidden="true">
        <div class="splash-icon__inner">
          <div class="splash-icon__face splash-icon__front"></div>
          <div class="splash-icon__face splash-icon__back"></div>
        </div>
      </div>
      <span class="splash-sr">Loading</span>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
