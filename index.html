<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#FDF9EF" />
    <title>Instructor Panel</title>
    <!-- Theme-aware favicon: the ink mark on light tab strips, the white mark
         on dark ones. The media attribute is the declarative half; browsers
         that ignore it on icon links are handled by the swap script below. -->
    <link rel="icon" type="image/svg+xml" href="/icon-black.svg" media="(prefers-color-scheme: light)" />
    <link rel="icon" type="image/svg+xml" href="/icon-white.svg" media="(prefers-color-scheme: dark)" />
    <!-- Home-screen icons are composited on an opaque tile, so a transparent
         mark would sit on black. The gold plate keeps that case legible. -->
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <script>
      // Not every browser honours `media` on an icon link, and none of them
      // re-evaluate it when the OS theme flips mid-session. Pointing a single
      // link at the right file covers both.
      (function () {
        // Take the base from the link above rather than hardcoding "/": the
        // build rewrites that href for subpath deploys (/Vue/ on Pages), but it
        // cannot rewrite a string sitting inside this script.
        var declared = document.querySelector('link[rel="icon"][media*="light"]');
        var base = (declared ? declared.getAttribute("href") : "/icon-black.svg")
          .replace(/icon-black\.svg$/, "");
        var dark = window.matchMedia("(prefers-color-scheme: dark)");
        var link = document.createElement("link");
        link.rel = "icon";
        link.type = "image/svg+xml";
        var apply = function () {
          link.href = base + (dark.matches ? "icon-white.svg" : "icon-black.svg");
        };
        apply();
        document.head.appendChild(link);
        // Safari <14 only has the deprecated listener form.
        if (dark.addEventListener) dark.addEventListener("change", apply);
        else if (dark.addListener) dark.addListener(apply);
      })();
    </script>
    <link rel="preload" as="image" href="/icon-tower.svg" />
    <link rel="preload" as="image" href="/icon-rays.svg" />
    <style>
      /* Boot splash. Inlined on purpose: this has to paint before the bundle
         and the stylesheet arrive, which is the whole window it covers. */
      #app-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 22px;
        background: #FDF9EF;
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
        transition: opacity .35s ease, visibility .35s ease;
      }
      #app-splash[hidden-fading] { opacity: 0; visibility: hidden; }

      /* Ring + icon. The ring is a conic sweep masked to a hairline; the icon
         flips left-to-right on its Y axis inside it. Both pure CSS/asset so the
         splash paints before the bundle arrives. */
      .splash-loader {
        position: relative;
        display: grid;
        place-items: center;
        width: 108px;
        height: 108px;
        perspective: 760px;
      }

      /* Static track, so the sweep reads as travelling along a circle rather
         than floating in space. */
      .splash-loader::before {
        content: "";
        position: absolute;
        inset: 0;
        border-radius: 999px;
        border: 3px solid rgba(26, 26, 26, .07);
      }

      .splash-ring {
        position: absolute;
        inset: 0;
        border-radius: 999px;
        background: conic-gradient(
          from 0deg,
          rgba(255, 205, 0, 0) 0deg,
          rgba(255, 205, 0, .12) 120deg,
          #FFCD00 300deg,
          #E0A800 360deg
        );
        -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 3px), #000 calc(100% - 3px));
        mask: radial-gradient(farthest-side, transparent calc(100% - 3px), #000 calc(100% - 3px));
        animation: splash-sweep 1.15s linear infinite;
      }

      /* The mark is split in two: the lighthouse holds still while only its
         beams turn, so the icon reads as a beacon rather than a spinning logo. */
      .splash-mark {
        position: relative;
        width: 58px;
        height: 58px;
        transform-style: preserve-3d;
      }
      .splash-mark img {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
      }
      .splash-rays {
        /* The beams meet the lamp at x=74 and x=110 of the 192 viewBox, so their
           mirror axis is x=92 — the tower's centre, not the box's. Flipping about
           the default 50% detaches each beam from the lamp by ~8px. */
        transform-origin: 47.92% 50%;
        /* The two beams are not the same width (74 vs 81 of 192), so a mirror
           lands the artwork ~7px left of where it started. This nudges the
           flipped half back. Positive moves right; tune to taste. */
        --flip-nudge: 1.8%;
        animation: splash-flip 1.9s cubic-bezier(.62, .02, .34, 1) infinite;
      }

      @keyframes splash-sweep {
        to { transform: rotate(360deg); }
      }

      /* Left-to-right flip, with a beat on each face so it reads as a deliberate
         turn rather than a constant spin. */
      @keyframes splash-flip {
        0%   { transform: translateX(0) rotateY(0deg); }
        40%  { transform: translateX(var(--flip-nudge)) rotateY(180deg); }
        55%  { transform: translateX(var(--flip-nudge)) rotateY(180deg); }
        95%  { transform: translateX(0) rotateY(360deg); }
        100% { transform: translateX(0) rotateY(360deg); }
      }

      /* Visually hidden, still announced — the splash carries no visible text. */
      .splash-sr {
        position: absolute;
        width: 1px;
        height: 1px;
        margin: -1px;
        padding: 0;
        overflow: hidden;
        clip: rect(0 0 0 0);
        white-space: nowrap;
        border: 0;
      }

      @media (prefers-reduced-motion: reduce) {
        .splash-rays { animation: none; }
        .splash-ring { animation: none; opacity: .8; }
        #app-splash { transition: none; }
      }

      @media (prefers-color-scheme: dark) {
        /* The app itself is light, so keep the splash light too — flashing dark
           and then white is worse than one consistent ground. */
        #app-splash { background: #FDF9EF; }
      }
    </style>
  </head>
  <body>
    <div id="app-splash" role="status" aria-live="polite">
      <div class="splash-loader" aria-hidden="true">
        <div class="splash-ring"></div>
        <div class="splash-mark">
          <img class="splash-tower" src="/icon-tower.svg" alt="" />
          <img class="splash-rays" src="/icon-rays.svg" alt="" />
        </div>
      </div>
      <span class="splash-sr">Loading</span>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
