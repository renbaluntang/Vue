<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#FDF9EF" />
    <title>Instructor Panel</title>
    <link rel="preload" as="image" href="/icon-tower.svg" />
    <link rel="preload" as="image" href="/icon-rays.svg" />
    <style>
      /* Boot splash. Inlined on purpose: this has to paint before the bundle
         and the stylesheet arrive, which is the whole window it covers. */
      #app-splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 22px;
        background: #FDF9EF;
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
        transition: opacity .35s ease, visibility .35s ease;
      }
      #app-splash[hidden-fading] { opacity: 0; visibility: hidden; }

      /* Ring + icon. The ring is a conic sweep masked to a hairline; the icon
         flips left-to-right on its Y axis inside it. Both pure CSS/asset so the
         splash paints before the bundle arrives. */
      .splash-loader {
        position: relative;
        display: grid;
        place-items: center;
        width: 108px;
        height: 108px;
        perspective: 760px;
      }

      /* Static track, so the sweep reads as travelling along a circle rather
         than floating in space. */
      .splash-loader::before {
        content: "";
        position: absolute;
        inset: 0;
        border-radius: 999px;
        border: 3px solid rgba(26, 26, 26, .07);
      }

      .splash-ring {
        position: absolute;
        inset: 0;
        border-radius: 999px;
        background: conic-gradient(
          from 0deg,
          rgba(255, 205, 0, 0) 0deg,
          rgba(255, 205, 0, .12) 120deg,
          #FFCD00 300deg,
          #E0A800 360deg
        );
        -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 3px), #000 calc(100% - 3px));
        mask: radial-gradient(farthest-side, transparent calc(100% - 3px), #000 calc(100% - 3px));
        animation: splash-sweep 1.15s linear infinite;
      }

      /* The mark is split in two: the lighthouse holds still while only its
         beams turn, so the icon reads as a beacon rather than a spinning logo. */
      .splash-mark {
        position: relative;
        width: 58px;
        height: 58px;
        transform-style: preserve-3d;
      }
      .splash-mark img {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
      }
      .splash-rays {
        animation: splash-flip 1.9s cubic-bezier(.62, .02, .34, 1) infinite;
      }

      @keyframes splash-sweep {
        to { transform: rotate(360deg); }
      }

      /* Left-to-right flip, with a beat on each face so it reads as a deliberate
         turn rather than a constant spin. */
      @keyframes splash-flip {
        0%   { transform: rotateY(0deg); }
        40%  { transform: rotateY(180deg); }
        55%  { transform: rotateY(180deg); }
        95%  { transform: rotateY(360deg); }
        100% { transform: rotateY(360deg); }
      }

      /* Visually hidden, still announced — the splash carries no visible text. */
      .splash-sr {
        position: absolute;
        width: 1px;
        height: 1px;
        margin: -1px;
        padding: 0;
        overflow: hidden;
        clip: rect(0 0 0 0);
        white-space: nowrap;
        border: 0;
      }

      @media (prefers-reduced-motion: reduce) {
        .splash-rays { animation: none; }
        .splash-ring { animation: none; opacity: .8; }
        #app-splash { transition: none; }
      }

      @media (prefers-color-scheme: dark) {
        /* The app itself is light, so keep the splash light too — flashing dark
           and then white is worse than one consistent ground. */
        #app-splash { background: #FDF9EF; }
      }
    </style>
  </head>
  <body>
    <div id="app-splash" role="status" aria-live="polite">
      <div class="splash-loader" aria-hidden="true">
        <div class="splash-ring"></div>
        <div class="splash-mark">
          <img class="splash-tower" src="/icon-tower.svg" alt="" />
          <img class="splash-rays" src="/icon-rays.svg" alt="" />
        </div>
      </div>
      <span class="splash-sr">Loading</span>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
